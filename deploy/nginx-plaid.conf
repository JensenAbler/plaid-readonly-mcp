# Included from the mcp.jensenabler.com server block.
location /plaid/ {
    proxy_pass http://127.0.0.1:8805;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 300s;
}
location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration)/plaid/oauth$ {
    proxy_pass http://127.0.0.1:8805;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-protected-resource/plaid/mcp {
    proxy_pass http://127.0.0.1:8805;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
